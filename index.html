<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STS Project Number Generator - Firebase</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; color: white; margin-bottom: 30px; font-size: 2.5em; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        .content { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .card { background: white; border-radius: 10px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .card h2 { color: #667eea; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #333; font-weight: 600; font-size: 0.9em; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 5px; font-size: 1em; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
        button { padding: 12px; border: none; border-radius: 5px; font-size: 1em; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .gen-btn { width: 100%; background: #667eea; color: white; margin-top: 10px; }
        .gen-btn:hover { background: #5568d3; }
        .symbol-buttons { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-bottom: 8px; }
        .symbol-btn { padding: 10px; border: 3px solid #ddd; background: white; color: #333; border-radius: 5px; cursor: pointer; font-size: 0.85em; font-weight: 600; transition: all 0.2s; }
        .symbol-btn:hover { border-color: #667eea; background: #f0f4ff; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(102, 126, 234, 0.2); }
        .symbol-btn.active { background: #667eea; color: white; border-color: #667eea; box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4); transform: translateY(-3px); }
        .used-numbers { max-height: 400px; overflow-y: auto; margin-top: 15px; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
        .number-tag { display: flex; flex-direction: column; background: #e8f4f8; color: #667eea; padding: 8px; border-radius: 5px; font-size: 0.75em; font-family: 'Courier New', monospace; border: 1px solid #d0e8f2; }
        .number-tag.active { background: #00a650; color: white; border-color: #008c3f; }
        .number-tag-header { display: flex; justify-content: space-between; margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid rgba(0,0,0,0.1); }
        .number-tag-number { font-weight: 600; flex: 1; word-break: break-all; }
        .delete-btn { background: none; border: none; color: inherit; cursor: pointer; font-size: 1.1em; padding: 0; margin-left: 3px; opacity: 0.6; }
        .delete-btn:hover { opacity: 1; transform: scale(1.2); }
        .success-message { position: fixed; top: 20px; right: 20px; background: #28a745; color: white; padding: 15px 25px; border-radius: 5px; opacity: 0; transform: translateX(400px); transition: all 0.3s; z-index: 1000; }
        .success-message.show { opacity: 1; transform: translateX(0); }
        .result-box { background: #f8f9ff; border: 2px solid #667eea; border-radius: 8px; padding: 20px; margin-top: 15px; }
        .project-number { font-size: 2.5em; font-weight: 700; color: #00a650; text-align: center; font-family: 'Courier New', monospace; margin: 15px 0; }
        .next-number { background: #fff3cd; border: 1px solid #ffc107; border-radius: 5px; padding: 15px; margin: 15px 0; }
        .section-title { color: #667eea; font-size: 0.9em; text-transform: uppercase; font-weight: 600; margin-top: 15px; margin-bottom: 10px; letter-spacing: 1px; }
        .export-section { margin-top: 20px; padding-top: 20px; border-top: 2px solid #eee; }
        .export-options { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-bottom: 10px; }
        .export-button, .import-button { background: #667eea; color: white; width: 100%; margin-top: 10px; }
        .export-button:hover, .import-button:hover { background: #5568d3; }
        .empty-state { text-align: center; color: #999; padding: 20px; }
        .sync-indicator { position: fixed; bottom: 20px; right: 20px; padding: 10px 15px; border-radius: 5px; font-size: 0.85em; color: white; z-index: 999; }
        .sync-syncing { background: #667eea; }
        .sync-synced { background: #28a745; }
        .sync-error { background: #dc3545; }
        @media (max-width: 768px) { .content { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏭 STS Project Number Generator</h1>
        <div class="content">
            <div class="card">
                <h2>📝 Create Project Number</h2>
                <div class="form-group">
                    <label for="customer">Customer *</label>
                    <select id="customer" onchange="updateProjectType()">
                        <option value="">Select Customer</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="projectType">Project Type *</label>
                    <select id="projectType"><option value="">Select Type</option></select>
                </div>
                <div class="form-group">
                    <label for="mainNo">Main No *</label>
                    <input type="text" id="mainNo" placeholder="e.g., 023" maxlength="3">
                </div>
                <div class="form-group">
                    <label for="subNo">Sub No *</label>
                    <input type="text" id="subNo" placeholder="e.g., 001" maxlength="3">
                </div>
                <div class="form-group">
                    <label for="qty">QTY *</label>
                    <input type="text" id="qty" placeholder="1-99, RH-1 to RH-99, etc" maxlength="10">
                </div>
                <div class="form-group">
                    <label for="machineName">Machine Name</label>
                    <input type="text" id="machineName" placeholder="Robot A, Station 1, etc">
                </div>
                <div class="form-group">
                    <label>Symbol</label>
                    <div class="symbol-buttons">
                        <button type="button" class="symbol-btn active" data-symbol="" onclick="selectSymbol('', event)">✓ None</button>
                        <button type="button" class="symbol-btn" data-symbol="@" onclick="selectSymbol('@', event)">@: Mistake</button>
                        <button type="button" class="symbol-btn" data-symbol="#" onclick="selectSymbol('#', event)"># Problem</button>
                        <button type="button" class="symbol-btn" data-symbol="$" onclick="selectSymbol('$', event)">$ Spec</button>
                        <button type="button" class="symbol-btn" data-symbol="%" onclick="selectSymbol('%', event)">% Missing</button>
                    </div>
                </div>
                <button type="button" class="gen-btn" onclick="generateProjectNumber()">Generate</button>
                <div class="success-message" id="successMessage">✓ Saved!</div>
                <div class="result-box" id="resultBox" style="display: none;">
                    <div style="color: #999; font-size: 0.9em;">Generated Project Number</div>
                    <div class="project-number" id="generatedNumber">-</div>
                    <button type="button" onclick="copyToClipboard()" style="background: #764ba2; margin-top: 15px; width: 100%; color: white;">📋 Copy</button>
                </div>
            </div>
            <div class="card">
                <h2>📊 Project Management</h2>
                <div style="margin-bottom: 15px;">
                    <div style="font-size: 0.9em; color: #666;">Selected Customer:</div>
                    <div style="font-size: 1.2em; font-weight: 600; color: #667eea;" id="currentCustomer">-</div>
                </div>
                <div style="margin-bottom: 15px;">
                    <div style="font-size: 0.9em; color: #666;">Used Project Numbers:</div>
                    <div style="font-size: 1.2em; font-weight: 600; color: #667eea;" id="usedCount">0</div>
                </div>
                <div class="next-number" id="nextNumberBox" style="display: none;">
                    <div style="font-size: 0.9em; margin-bottom: 5px;">Suggested Next Number:</div>
                    <strong id="nextNumberValue">-</strong>
                </div>
                <div class="section-title">Used Project Numbers</div>
                <div class="used-numbers" id="usedNumbersList">
                    <div class="empty-state">No numbers yet</div>
                </div>
                <button type="button" style="display: none; background: #ff6b6b; width: 100%; margin-top: 10px; color: white;" id="deleteKobanBtn" onclick="openDeleteKobanDialog()">🗑️ Delete All</button>
                <div class="export-section">
                    <div class="section-title">Export to CSV</div>
                    <div class="export-options">
                        <select id="exportCustomer" onchange="updateDeleteKobanBtn()">
                            <option value="">All Projects</option>
                        </select>
                        <button type="button" style="display: none; background: #ff6b6b;" id="deleteExportBtn" onclick="deleteKobanExport()">🗑️ Delete</button>
                    </div>
                    <button type="button" class="export-button" onclick="exportToCSV()">📥 Download CSV</button>
                    <button type="button" class="export-button" style="background: #17a2b8;" onclick="exportAllCSV()">📥 All Summary</button>
                </div>
            </div>
        </div>
    </div>
    <div class="sync-indicator sync-syncing" id="syncIndicator">🔄 Connecting to Firebase...</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where, deleteDoc, doc, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDIkHIXGoZe9PIgOO3u7Q2xw-DY6xbn77s",
            authDomain: "sts-project-generator.firebaseapp.com",
            projectId: "sts-project-generator",
            storageBucket: "sts-project-generator.firebasestorage.app",
            messagingSenderId: "78814864563",
            appId: "1:78814864563:web:ef581fa8bda2238eebbcc6",
            measurementId: "G-0XCBKKGTSQ"
        };

        // Init Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Global Data
        let projectNumbers = {};
        let currentSymbol = '';

        // Customer Map
        const customerMap = {
            'KF': 'KFN', 'TM': 'TMMIN', 'TB': 'TDB', 'AS': 'ASSB', 'TP': 'TMP',
            'PD': 'PERODUA', 'SZ': 'SUZUKI', 'ISZ': 'ISUZU', 'AM': 'ADM', 'UP': 'UNIPRES',
            'HK': 'HK-PATI', 'HP': 'HPM', 'BI': 'BELSONICA', 'YT': 'Y-TEC', 'SB': 'SUBARU',
            'AG': 'ASAHI GLASS', 'Z': 'DEMO MACHINE', 'STS': 'STS STD'
        };

        const typeMap = {
            'TL': 'Total Layout Equipment', 'TR': 'Total Layout Robot', 'A': 'Arc Jig',
            'S': 'Spot Jig', 'R': 'Roller Hem', 'P': 'Press Hem', 'TT': 'Table Top Hem',
            'C': 'Checking Fixture', 'ST': 'Set Jig', 'H': 'Hole Drilling', 'VP': 'Vertical Positioner',
            'HP': 'Horizontal Positioner', 'SM': 'Sliding Machine', 'M': 'Matehand',
            'CV': 'Conveyor System', 'RH': 'Roller Head', 'PL': 'Pallet', 'PM': 'Press Machine', 'GK': 'Genchi Kouji'
        };

        // Init
        document.addEventListener('DOMContentLoaded', function() {
            initSelects();
            loadFromFirestore();
            setupRealtime();
        });

        function initSelects() {
            const custSel = document.getElementById('customer');
            Object.keys(customerMap).sort().forEach(code => {
                const opt = document.createElement('option');
                opt.value = code;
                opt.textContent = customerMap[code] + ' (' + code + ')';
                custSel.appendChild(opt);
            });

            const typeSel = document.getElementById('projectType');
            Object.keys(typeMap).sort().forEach(code => {
                const opt = document.createElement('option');
                opt.value = code;
                opt.textContent = code + ' - ' + typeMap[code];
                typeSel.appendChild(opt);
            });
        }

        async function loadFromFirestore() {
            try {
                updateSync('Loading...', 'syncing');
                const snap = await getDocs(collection(db, 'projects'));
                projectNumbers = {};
                snap.forEach(doc => {
                    const data = doc.data();
                    const c = data.customer;
                    if (!projectNumbers[c]) projectNumbers[c] = [];
                    projectNumbers[c].push({
                        id: doc.id,
                        number: data.number,
                        qty: data.qty || '',
                        machineName: data.machineName || ''
                    });
                });
                Object.keys(projectNumbers).forEach(c => {
                    projectNumbers[c].sort((a, b) => a.number.localeCompare(b.number));
                });
                updateUI();
                updateSync('✓ Ready', 'synced');
            } catch (error) {
                console.error('Load error:', error);
                updateSync('Error loading', 'error');
            }
        }

        function setupRealtime() {
            onSnapshot(collection(db, 'projects'), async () => {
                await loadFromFirestore();
            }, (error) => {
                console.error('Listener error:', error);
                updateSync('Sync error', 'error');
            });
        }

        function updateSync(msg, status) {
            const el = document.getElementById('syncIndicator');
            el.textContent = msg;
            el.className = 'sync-indicator sync-' + status;
            if (status === 'synced') setTimeout(() => { el.style.opacity = '0.5'; }, 2000);
        }

        function updateUI() {
            updateUsedNumbers();
            suggestNextNumber();
            updateExportPrefixes();
        }

        window.selectSymbol = function(sym, e) {
            e.preventDefault();
            currentSymbol = sym;
            document.querySelectorAll('.symbol-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
        };

        window.updateProjectType = function() {
            const c = document.getElementById('customer').value;
            document.getElementById('currentCustomer').textContent = c ? (customerMap[c] + ' (' + c + ')') : '-';
            updateUI();
        };

        window.generateProjectNumber = async function() {
            const customer = document.getElementById('customer').value;
            const projectType = document.getElementById('projectType').value;
            const mainNo = document.getElementById('mainNo').value;
            const subNo = document.getElementById('subNo').value;
            const qty = document.getElementById('qty').value.trim();
            const machineName = document.getElementById('machineName').value.trim();

            if (!customer || !projectType || !mainNo || !subNo || !qty) {
                alert('Fill all required fields');
                return;
            }

            const num = customer + mainNo + '-' + projectType + subNo + currentSymbol;

            if (!projectNumbers[customer]) projectNumbers[customer] = [];
            if (projectNumbers[customer].some(i => i.number === num)) {
                alert('Already exists');
                return;
            }

            try {
                updateSync('Saving...', 'syncing');
                await addDoc(collection(db, 'projects'), {
                    customer: customer,
                    number: num,
                    qty: qty,
                    machineName: machineName,
                    createdAt: new Date()
                });

                document.getElementById('generatedNumber').textContent = num;
                document.getElementById('resultBox').style.display = 'block';
                const msg = document.getElementById('successMessage');
                msg.classList.add('show');
                setTimeout(() => msg.classList.remove('show'), 2000);

                document.getElementById('qty').value = '';
                document.getElementById('machineName').value = '';
                currentSymbol = '';
                document.querySelectorAll('.symbol-btn').forEach(b => b.classList.remove('active'));
                document.querySelector('[data-symbol=""]').classList.add('active');

                updateSync('✓ Saved', 'synced');
            } catch (error) {
                console.error('Error:', error);
                alert('Error saving');
                updateSync('Error', 'error');
            }
        };

        function updateUsedNumbers() {
            const customer = document.getElementById('customer').value;
            const cont = document.getElementById('usedNumbersList');

            if (!customer || !projectNumbers[customer] || !projectNumbers[customer].length) {
                cont.innerHTML = '<div class="empty-state">No numbers</div>';
                document.getElementById('usedCount').textContent = '0';
                document.getElementById('deleteKobanBtn').style.display = 'none';
                return;
            }

            const nums = projectNumbers[customer];
            document.getElementById('usedCount').textContent = nums.length;

            let html = '';
            nums.forEach((data, idx) => {
                const isLast = idx === nums.length - 1;
                html += `<div class="number-tag ${isLast ? 'active' : ''}">
                    <div class="number-tag-header">
                        <div class="number-tag-number">${data.number}</div>
                        <button type="button" class="delete-btn" onclick="deleteNumber('${data.id}')" style="border: none; background: none; cursor: pointer; opacity: 0.6;">×</button>
                    </div>
                    <div style="font-size: 0.65em; display: flex; flex-direction: column; gap: 3px;">
                        <div style="display: flex; justify-content: space-between;">
                            <span style="opacity: 0.7;">QTY:</span>
                            <span style="font-weight: 600;">${data.qty}</span>
                        </div>
                        ${data.machineName ? `<div style="display: flex; justify-content: space-between;">
                            <span style="opacity: 0.7;">M:</span>
                            <span style="font-weight: 600;">${data.machineName}</span>
                        </div>` : ''}
                    </div>
                </div>`;
            });

            cont.innerHTML = html;
            document.getElementById('deleteKobanBtn').style.display = 'block';
        }

        window.deleteNumber = async function(id) {
            if (!confirm('Delete?')) return;
            try {
                updateSync('Deleting...', 'syncing');
                await deleteDoc(doc(db, 'projects', id));
                updateSync('✓ Deleted', 'synced');
            } catch (error) {
                console.error('Error:', error);
                updateSync('Error', 'error');
            }
        };

        function suggestNextNumber() {
            const customer = document.getElementById('customer').value;
            const box = document.getElementById('nextNumberBox');

            if (!customer) { box.style.display = 'none'; return; }

            let nextMain = '000', nextSub = '001';
            if (projectNumbers[customer] && projectNumbers[customer].length) {
                const last = projectNumbers[customer][projectNumbers[customer].length - 1].number.replace(/[@#$%]$/, '');
                const parts = last.split('-');
                if (parts.length >= 2) {
                    nextMain = parts[0].replace(/^[A-Z]+/, '');
                    nextSub = String(parseInt(parts[1]) + 1).padStart(3, '0');
                }
            }
            document.getElementById('nextNumberValue').textContent = customer + nextMain + '-?' + nextSub;
            box.style.display = 'block';
        }

        window.copyToClipboard = function() {
            const text = document.getElementById('generatedNumber').textContent;
            navigator.clipboard.writeText(text);
            alert('Copied: ' + text);
        };

        function updateExportPrefixes() {
            const sel = document.getElementById('exportCustomer');
            const prefixes = new Set();
            Object.keys(projectNumbers).forEach(c => {
                if (projectNumbers[c]) {
                    projectNumbers[c].forEach(data => {
                        const match = data.number.replace(/[@#$%]$/, '').match(/^([A-Z]+)(\d+)-/);
                        if (match) prefixes.add(match[1] + match[2]);
                    });
                }
            });
            while (sel.options.length > 1) sel.remove(1);
            Array.from(prefixes).sort().forEach(p => {
                const opt = document.createElement('option');
                opt.value = p;
                opt.textContent = p;
                sel.appendChild(opt);
            });
            updateDeleteKobanBtn();
        }

        window.updateDeleteKobanBtn = function() {
            const prefix = document.getElementById('exportCustomer').value;
            const btn = document.getElementById('deleteExportBtn');
            btn.style.display = prefix ? 'block' : 'none';
            if (prefix) btn.textContent = '🗑️ Delete ' + prefix;
        };

        window.exportToCSV = function() {
            const prefix = document.getElementById('exportCustomer').value;
            let data = [];
            Object.keys(projectNumbers).forEach(c => {
                if (projectNumbers[c]) {
                    projectNumbers[c].forEach(item => {
                        const clean = item.number.replace(/[@#$%]$/, '');
                        const match = clean.match(/^([A-Z]+)(\d+)-/);
                        if (!prefix || (match && match[1] + match[2] === prefix)) {
                            const parts = clean.split('-');
                            const type = parts[1].replace(/[0-9]/g, '');
                            data.push([item.number, typeMap[type] || '', item.qty, item.machineName]);
                        }
                    });
                }
            });

            if (!data.length) { alert('No data'); return; }

            let csv = 'No,Project Number,Description,QTY,Machine Name\n';
            data.forEach((row, i) => {
                csv += (i + 1) + ',"' + row[0] + '","' + row[1] + '","' + row[2] + '","' + row[3] + '"\n';
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = prefix ? prefix + '.csv' : 'AllProjects.csv';
            link.click();
        };

        window.exportAllCSV = function() {
            const groups = {};
            Object.keys(projectNumbers).forEach(c => {
                if (projectNumbers[c]) {
                    projectNumbers[c].forEach(item => {
                        const match = item.number.replace(/[@#$%]$/, '').match(/^([A-Z]+)(\d+)-/);
                        if (match) {
                            const p = match[1] + match[2];
                            if (!groups[p]) groups[p] = [];
                            const type = item.number.split('-')[1].replace(/[0-9]/g, '');
                            groups[p].push([item.number, typeMap[type] || '', item.qty, item.machineName]);
                        }
                    });
                }
            });

            let csv = 'Koban,No,Project Number,Description,QTY,Machine Name\n';
            Object.keys(groups).sort().forEach(p => {
                groups[p].forEach((row, i) => {
                    csv += p + ',' + (i + 1) + ',"' + row[0] + '","' + row[1] + '","' + row[2] + '","' + row[3] + '"\n';
                });
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'AllProjects.csv';
            link.click();
        };

        window.deleteKobanExport = async function() {
            const prefix = document.getElementById('exportCustomer').value;
            if (!prefix) {
                alert('Please select a koban first');
                return;
            }

            // First confirmation
            if (!confirm('Are you sure you want to delete all project numbers for ' + prefix + '?\n\nThis action cannot be undone.')) {
                return;
            }

            // Password confirmation
            const pwd = prompt('Enter password to confirm deletion:');
            if (!pwd) return;
            if (pwd !== 'shinkoh2024') {
                alert('❌ Wrong password. Deletion cancelled.');
                return;
            }

            try {
                updateSync('Deleting...', 'syncing');
                const snap = await getDocs(query(collection(db, 'projects'), where('customer', '==', prefix.substring(0, prefix.length - 3))));
                const batch = writeBatch(db);
                snap.forEach(d => {
                    const clean = d.data().number.replace(/[@#$%]$/, '').match(/^([A-Z]+)(\d+)-/);
                    if (clean && clean[1] + clean[2] === prefix) batch.delete(d.ref);
                });
                await batch.commit();
                document.getElementById('exportCustomer').value = '';
                updateDeleteKobanBtn();
                updateSync('✓ Deleted', 'synced');
                alert('✓ All project numbers for ' + prefix + ' have been successfully deleted.');
            } catch (error) {
                console.error('Error:', error);
                alert('❌ Error deleting data. Please try again.');
                updateSync('Error', 'error');
            }
        };

        window.openDeleteKobanDialog = async function() {
            const customer = document.getElementById('customer').value;
            if (!customer || !projectNumbers[customer] || !projectNumbers[customer].length) {
                alert('No data to delete');
                return;
            }

            // First confirmation
            if (!confirm('Are you sure you want to delete all project numbers for ' + customerMap[customer] + ' (' + customer + ')?\n\nThis action cannot be undone.')) {
                return;
            }

            // Password confirmation
            const pwd = prompt('Enter password to confirm deletion:');
            if (!pwd) return;
            if (pwd !== 'shinkoh2024') {
                alert('❌ Wrong password. Deletion cancelled.');
                return;
            }

            try {
                updateSync('Deleting...', 'syncing');
                const snap = await getDocs(query(collection(db, 'projects'), where('customer', '==', customer)));
                const batch = writeBatch(db);
                snap.forEach(d => batch.delete(d.ref));
                await batch.commit();
                updateSync('✓ Deleted', 'synced');
                alert('✓ All project numbers for ' + customerMap[customer] + ' have been successfully deleted.');
            } catch (error) {
                console.error('Error:', error);
                alert('❌ Error deleting data. Please try again.');
                updateSync('Error', 'error');
            }
        };
    </script>
</body>
</html>
